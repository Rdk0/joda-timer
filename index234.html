    <script type="application/x-scittle">

      (require '["JSJoda" :as js-joda])
      (require 
         '[reagent.core :as r]
         '[reagent.dom :as rdom]
         '[goog.string :as gstring]
         '[goog.string.format])


(defn current-eastern-zone []
"find if EST or EDT is applicable at this time"
 ;Usage:
 ;=> "EDT" (between March and November)
 ;=> "EST" (between November and March)
  (let [now (js/Date.)
        formatter (js/Intl.DateTimeFormat. "en-US" 
                    #js {:timeZone "America/New_York" 
                         :timeZoneName "short"})
        parts (js->clj (.formatToParts formatter now) :keywordize-keys true)]
    (:value (first (filter #(= (:type %) "timeZoneName") parts)))))


;; atoms and constants
(defonce zone-offset (if (= "EDT" current-eastern-zone ) -5 -4))
;;file name for the mergeed pdf
(defonce pdf-file-out "OICR-RSL-20.pdf")
(defonce est-offset (js/JSJoda.ZoneOffset.ofHours zone-offset)) ; EDT is UTC-4 between mid-March to early November otherwise it is UTC-5
(defonce state (r/atom "2026-07-25 06:20:34"))
(defonce now-time (r/atom nil))
(defonce state2 (r/atom "2026-07-25 06:20:34"))
(defonce diff (r/atom "0"))
(defonce mass1 (r/atom 0))
(defonce mass2 (r/atom 0))
(defonce mass-diff (r/atom "" ))


;; Helper to safely parse strings or return the object if already an Instant
(defn ->instant [v]
  (cond
    (string? v) (try
                  (js/JSJoda.Instant.parse v)
                  (catch :default _ nil))
    (instance? js/JSJoda.Instant v) v
    :else nil))


(defn format-iso-string [inst]
  (when inst
    (let [s (if (string? inst) inst (.toString inst))]
      (-> s
          (clojure.string/replace "T" " ")
          ;; Take up to 19 characters safely
          (as-> formatted-str
            (if (> (count formatted-str) 19)
              (subs formatted-str 0 19)
              formatted-str))))))


  (defn format-string-iso-joda [s]
  (when (seq s)
    (let [iso-like (clojure.string/replace s " " "T")
          ldt      (js/JSJoda.LocalDateTime.parse iso-like)
          instant  (.toInstant ldt js/JSJoda.ZoneOffset.UTC)]
      (.toString instant))))


(defn format-duration [duration]
 ;;convert duration to a day hour string
  (let [total-hours (/ (.toMillis duration) 3600000.0) ; Convert ms to total hours as a float
        days        (quot (long total-hours) 24)       ; Integer division to get full days
        rem-hours   (- total-hours (* days 24))        ; Remaining hours
        formatted-h (.toFixed rem-hours 1)]            ; Format hours to 1 decimal place
    (cond
      (pos? days) (str days " d and " formatted-h " h")
      :else       (str formatted-h " h"))))


(defn get-time-diff []
;;calculate the time difference
;;in: state ands state2 atoms,
;;:out: string in format x day y h
  (let [i1 (->instant (format-string-iso-joda @state))
        i2 (->instant (format-string-iso-joda@state2))]
    (if (and i1 i2)
      (let [dur (js/JSJoda.Duration.between i1 i2)]
        (format-duration dur))
      "Invalid date string")))

(defn get-mass-diff []
    (let [m1  @mass1
          m2  @mass2
          diff- (- m2 m1)
          diff-abs (abs diff-)
          diff-str (gstring/format "%.2f" diff-abs )]
    (if (pos? diff-)      
         (str m2 " - " m1 " = "  diff-str)
         (str m1 " - " m2 " = "  diff-str))))


  ;;=======================================  
(defn merge-and-download-pdfs [files]
  (let [PDFDocument (.-PDFDocument js/PDFLib)]
    ;; 1. Create a blank PDF Document
    (-> (.create PDFDocument)
        (.then
         (fn [merged-doc]
           ;; 2. Convert all File objects into ArrayBuffers
           (let [buffer-promises (map #(.arrayBuffer %) files)]
             (-> (.all js/Promise (to-array buffer-promises))
                 (.then
                  (fn [buffers]
                    ;; 3. Load all PDFs from buffers
                    (let [load-promises (map #(.load PDFDocument %) buffers)]
                      (.all js/Promise (to-array load-promises)))))
                 (.then
                  (fn [pdf-docs]
                    ;; 4. Sequentially copy all pages into merged-doc
                    (let [copy-chain (reduce
                                      (fn [chain pdf-doc]
                                        (.then chain
                                               (fn []
                                                 (let [indices (.getPageIndices pdf-doc)]
                                                   (-> (.copyPages merged-doc pdf-doc indices)
                                                       (.then (fn [pages]
                                                                (.forEach pages #(.addPage merged-doc %)))))))))
                                      (.resolve js/Promise)
                                      pdf-docs)]
                      copy-chain)))
                 (.then
                  (fn []
                    ;; 5. Save and trigger browser download
                    (.save merged-doc)))
                 (.then
                  (fn [merged-bytes]
                    (let [blob (js/Blob. #js [merged-bytes] #js {:type "application/pdf"})
                          url (.createObjectURL js/URL blob)
                          link (.createElement js/document "a")]
                      (set! (.-href link) url)
                      (set! (.-download link) pdf-file-out)
                      (.click link)
                      (.revokeObjectURL js/URL url))))))))
        (.catch (fn [err]
      (js/console.error "Error merging pdfs:" err))))))

[:p {:style {:margin-top "16px" :margin-left "16px"}}

[:p {:style {:margin-top "16px" :margin-left "6px"}}
        [:button {:on-click #(reset! mass-diff (get-mass-diff)
                              (.writeText js/navigator.clipboard (get-mass-diff)))}
        "calculate Δm"] " " ; space between button and text
  @mass-diff]

 [:label
  "Select pdf files to combine: "
 [:input {:type "file"
           :accept ".pdf"
           :multiple true
           :on-change (fn [e]
                        (let [file-list (.. e -target -files)
                              files-array (js/Array.from file-list)]
                          (when (pos? (.-length files-array))
                           (merge-and-download-pdfs files-array))))}]]]

)
